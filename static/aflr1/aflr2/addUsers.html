<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рабочая область</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        .app-container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 15px;
            overflow-y: auto;
        }
        .resizer {
            width: 5px;
            background: #95a5a6;
            cursor: ew-resize;
        }
        .main-content {
            flex: 1;
            padding: 15px;
            background: #ecf0f1;
            display: flex;
            flex-direction: column;
        }
        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-btn {
            padding: 10px 20px;
            cursor: pointer;
            background: #bdc3c7;
            border: none;
            border-radius: 5px;
        }
        .mode-btn.active {
            background: #3498db;
            color: white;
        }
        .mode-container {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 10px;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: white;
            border: 1px solid #ccc;
        }
        #myPic {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            width: 40px;
            z-index: 100;
        }
    </style>
</head>
<body>

<img id="myPic" src="image1.png" style="cursor: pointer; width: 40px; position: absolute; top: 10px; right: 10px; z-index: 100;">

<div class="app-container">
    <aside id="sidebar" class="sidebar">
        <h4>Мои папки</h4>
        <div id="tree-container" class="folder-tree"></div>
    </aside>

    <div id="swimline" class="resizer"></div>

    <main class="main-content">
        <div class="mode-buttons">
            <button id="drawModeBtn" class="mode-btn active">✏️ Доска</button>
        </div>

        <div id="drawContainer" class="mode-container">
            <canvas id="canvas" width="800" height="500"></canvas>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<script type="module" src="/static/js/setadduser.js"></script>
<!--кнопки, которые по умолчанию: чат(открывает чат поверх экрана), рисование и с самого боку есть 3 кнопки: 1 - отвечает за открытие дерева папок, 2-за переход в меню пользователя, 3-за что нибудь еще +9-->
<script src="/static/js/settings.js"></script>

<script>
    const swimline = document.getElementById('swimline');
    const sidebar = document.getElementById('sidebar');
    let do = false;

    swimline.addEventListener('mousedown', (e) => {
        do = true;
        document.body.style.cursor = 'ew-resize';
    });

    document.addEventListener('mousemove', (e) => {
        if (!do) return;
        const newWidth = e.clientX;
        if (newWidth>150 && newWidth<500) {
            sidebar.style.width=newWidth + 'px';
        }
    });

    document.addEventListener('mouseup', () => {
        do = false;
        document.body.style.cursor='';
    });
</script>
</body>
</html>
