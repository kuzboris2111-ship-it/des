<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход в группу</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.23.0/dist/css/uikit.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="uk-flex uk-flex-center uk-flex-middle" style="min-height: 100vh;">
    <div class="uk-card uk-card-body uk-width-1-2 uk-width-1-3@m uk-border-rounded register-card">

    <h2 class="uk-card-title uk-text-center uk-text-primary">Вход</h2>
    <form id="loginForm">
         <div class="uk-margin">
        <input type="text" id="loginUsername" placeholder="Название группы" class="uk-input uk-form-large" required></div>
        <div class="uk-margin">
            <input type="password" id="loginPassword" placeholder="Пароль" class="uk-input uk-form-large"required></div>
        <button type="submit" class="uk-button uk-button-primary uk-width-1-1 uk-button-large uk-margin-top">Войти</button>
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.23.0/dist/js/uikit.min.js"></script>
    <script src="/static/js/forgroups.js"></script>
</body>
</html>
