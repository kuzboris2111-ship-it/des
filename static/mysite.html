<!DOCTYPE html>
<html lang="ru">
<head>
    <title>dep</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  </head>
<body>
    <h2>Desk</h2>
    <p class="subtitle">Поле для рисования1</p>
    <canvas id="canvas" width="800" height="500" ></canvas>
    <br>
    <button onclick="ctx.clearRect(0,0,800,500)">Очистить</button>

    <script>

        canvas.onmousedown = () => {
            painting = true;
            ctx.beginPath();
        };

        canvas.onmousemove = (f) => {
            if (!painting) return;
            ctx.lineTo(f.offsetX, f.offsetY);
            ctx.stroke();
            socket.emit('draw', {
            departmentId: departmentId,
            x: f.offsetX,
            y: f.offsetY
        });
        };

        canvas.onmouseup = () => painting = false;
        // Слушаем, что рисуют другие
        socket.on('draw', (data) => {
        if (data.departmentId === departmentId) {
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
        }
        });


        }
</script>
</body>
</html>
