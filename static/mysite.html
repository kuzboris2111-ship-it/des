<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Canvas tutorial</title>
    <script type="text/javascript">
      function draw() {
        const canvas = document.getElementById("tutorial");
        if (canvas.getContext) {
          const ctx = canvas.getContext("2d");
        }
      }
    </script>
  </head>
<body>
    <h2>Desk</h2>
    <p class="subtitle">Поле для рисования</p>
    <canvas id="canvas" width="800" height="500" ></canvas>
    <br>
    <button onclick="ctx.clearRect(0,0,800,500)">Очистить</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;


        canvas.onmousedown = () => {
            painting = true;
            ctx.beginPath();
        };

        canvas.onmousemove = (f) => {
            if (!painting) return;
            ctx.lineTo(f.offsetX, f.offsetY);
            ctx.stroke();
        };

        canvas.onmouseup = () => painting = false;
</script>
</body>
</html>
